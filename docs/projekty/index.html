    <script>// Stands in for the CMS on GitHub Pages: reads come from data.json, a form send goes nowhere.
;(() => {
  const BASE = '/allrisk-investment/'
  const realFetch = window.fetch.bind(window)
  let data
  const snapshot = () => (data ??= realFetch(`${BASE}data.json`).then((r) => r.json()))
  const json = (body) =>
    new Response(JSON.stringify(body), { headers: { 'content-type': 'application/json' } })

  window.fetch = async (input, init) => {
    const url = new URL(typeof input === 'string' ? input : input.url ?? input, location.href)
    if (url.origin !== location.origin || !url.pathname.startsWith('/api/'))
      return realFetch(input, init)
    if ((init?.method ?? 'GET').toUpperCase() !== 'GET') return json({ ok: true })
    const key = decodeURI(url.pathname + url.search)
    const all = await snapshot()
    if (key in all) return json(all[key])
    console.warn('[preview] not in the snapshot:', key)
    return json({ docs: [] })
  }

  // Plain anchors (editor links) carry a root path; the router's own links already have the base.
  document.addEventListener(
    'click',
    (event) => {
      const a = event.target.closest?.('a[href^="/"]')
      const href = a?.getAttribute('href')
      if (!href || href.startsWith('//') || href.startsWith(BASE)) return
      event.preventDefault()
      event.stopPropagation()
      location.href = BASE + href.slice(1)
    },
    true,
  )
})()
</script>
